<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1430">
<title>Game Plan</title>
<style>
:root{--bg:#0b1430;--s1:#111c3f;--s2:#17244d;--line:#263668;--tx:#eef1f8;--mu:#9ca8c9;--gold:#e5b94e;--red:#ff7a7a;--amber:#f5b04a;--green:#56d394;--blue:#74aeff;--rose:#f29ab8;--grey:#6f7ba0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 80px}
h1{font-size:26px;line-height:1.15;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:20px;line-height:1.2;margin:28px 0 10px;text-wrap:balance}
h3{font-size:16px;margin:0 0 4px}
p{margin:0 0 10px}
small,.mu{color:var(--mu)}
a{color:var(--gold)}
.num{font-variant-numeric:tabular-nums}
/* lock */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#lock .box{width:100%;max-width:360px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:24px}
#lock input{width:100%;font-size:18px;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);margin:12px 0}
#lock button{width:100%;font-size:17px;font-weight:700;padding:14px;border-radius:10px;border:0;background:var(--gold);color:#1b1503}
#err{color:var(--red);min-height:1.4em;margin:8px 0 0}
/* header */
.top{padding:22px 0 6px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.cd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.cd div{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.cd b{display:block;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.cd span{display:block;font-size:11px;color:var(--mu);margin-top:4px;line-height:1.25}
.cd .w b{color:var(--rose)}.cd .v b{color:var(--green)}.cd .i b{color:var(--gold)}
/* tabs */
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;font:inherit;font-size:14px;font-weight:700;color:var(--mu);background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:9px 14px}
.tabs button[aria-selected=true]{background:var(--gold);border-color:var(--gold);color:#1b1503}
section[hidden]{display:none}
/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-left:5px solid var(--grey);border-radius:12px;padding:14px;margin:10px 0}
.card.red{border-left-color:var(--red)}.card.amber{border-left-color:var(--amber)}.card.green{border-left-color:var(--green)}.card.blue{border-left-color:var(--blue)}.card.rose{border-left-color:var(--rose)}.card.gold{border-left-color:var(--gold)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin:0 6px 6px 0;background:var(--s2);color:var(--mu)}
.tag.red{background:#4a1f2a;color:var(--red)}.tag.amber{background:#4a3414;color:var(--amber)}.tag.green{background:#143d2d;color:var(--green)}.tag.rose{background:#45213a;color:var(--rose)}.tag.gold{background:#40340f;color:var(--gold)}.tag.blue{background:#1b3160;color:var(--blue)}
.big{font-size:18px;font-weight:700;line-height:1.3;margin:0 0 6px}
.msg{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.msg .mh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.msg small{display:block;color:var(--mu);margin-top:2px}
.msg pre{white-space:pre-wrap;word-wrap:break-word;font:inherit;font-size:15px;line-height:1.5;margin:10px 0 0;color:var(--tx)}
.cp{flex:none;font:inherit;font-size:14px;font-weight:800;padding:8px 16px;border-radius:9px;border:0;background:var(--gold);color:#1b1503;cursor:pointer}
.cp.done{background:var(--green);color:#06281a}
/* checklist */
.it{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.it:first-of-type{border-top:0}
.it input{position:absolute;opacity:0;width:0;height:0}
.it .bx{flex:0 0 26px;height:26px;border:2px solid var(--grey);border-radius:7px;margin-top:1px;display:flex;align-items:center;justify-content:center;font-weight:900;color:transparent}
.it input:checked+.bx{background:var(--green);border-color:var(--green);color:#06281a}
.it input:focus-visible+.bx{outline:2px solid var(--gold);outline-offset:2px}
.it input:checked~.tx{opacity:.45;text-decoration:line-through}
.it .tx{flex:1;min-width:0}
.it .tx b{display:block;font-weight:650}
.it .tx small{display:block;margin-top:2px}
.prog{display:flex;align-items:center;gap:10px;margin:6px 0 2px;font-size:13px;color:var(--mu)}
.prog i{flex:1;height:8px;border-radius:8px;background:var(--s2);overflow:hidden;display:block}
.prog i u{display:block;height:100%;background:var(--green);width:0;text-decoration:none}
/* rail */
.rail{display:flex;gap:0;overflow-x:auto;margin:12px -16px 4px;padding:4px 16px 8px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail div{flex:1 0 108px;position:relative;padding:22px 8px 0 0}
.rail div:before{content:"";position:absolute;top:8px;left:0;right:0;height:3px;background:var(--line)}
.rail div:after{content:"";position:absolute;top:2px;left:0;width:15px;height:15px;border-radius:50%;background:var(--rose);border:3px solid var(--bg)}
.rail div.hot:after{background:var(--red)}
.rail div.past:after{background:var(--grey)}
.rail b{display:block;font-size:14px}.rail span{display:block;font-size:12px;color:var(--mu);line-height:1.3}
/* tiles + bars */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:12px;color:var(--mu);margin-top:4px;line-height:1.3}
.bar{height:14px;border-radius:8px;background:var(--s2);overflow:hidden;margin:8px 0 4px}
.bar u{display:block;height:100%;background:var(--gold);text-decoration:none}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.05em;border-top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
/* timeline */
.day{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .d{font-size:12px;color:var(--mu);line-height:1.2}
.day .d b{display:block;font-size:20px;color:var(--tx);font-variant-numeric:tabular-nums}
.day.today{background:var(--s2);margin:0 -10px;padding:10px;border-radius:10px;border-top:0}
.day.gone{opacity:.45}
.day ul{margin:0;padding:0;list-style:none}
.day li{padding:2px 0 2px 16px;position:relative;font-size:15px}
.day li:before{content:"";position:absolute;left:0;top:10px;width:8px;height:8px;border-radius:50%;background:var(--grey)}
.day li.w:before{background:var(--rose)}.day li.i:before{background:var(--gold)}.day li.a:before{background:var(--green)}.day li.m:before{background:var(--blue)}.day li.x:before{background:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mu);margin:6px 0 10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.ros{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;font-size:15px}
.ros b{font-variant-numeric:tabular-nums;color:var(--mu);font-weight:600}
.ros .k{color:var(--tx);font-weight:700}
.foot{margin-top:30px;font-size:13px;color:var(--mu)}
@media(min-width:560px){h1{font-size:32px}.tiles{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:no-preference){.prog i u,.bar u{transition:width .25s}}
</style>
</head>
<body>
<div id="lock"><div class="box">
  <div class="eyebrow">Private</div>
  <h1>Game Plan</h1>
  <p class="mu">Same passphrase as your Past Presidents page. This phone remembers it after the first time.</p>
  <form id="f"><input id="p" type="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Passphrase"><button type="submit">Open</button></form>
  <p id="err" role="alert"></p>
</div></div>
<div id="app" hidden></div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unseal(pass){
  const env=JSON.parse(atob(SEALED));
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(env.s),iterations:env.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const out=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.i)},key,b64(env.d));
  return new TextDecoder().decode(out);
}
const LSP="gp-pass-v1",LST="gp-ticks-v1",LSTAB="gp-tab-v1";
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
async function open(pass,quiet){
  try{
    const html=await unseal(pass);
    document.getElementById("app").innerHTML=html;
    document.getElementById("lock").remove();
    document.getElementById("app").hidden=false;
    set(LSP,pass); init();
  }catch(e){ if(!quiet) document.getElementById("err").textContent="That passphrase did not open it. Try again."; }
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();open(document.getElementById("p").value.trim());});
const saved=get(LSP); if(saved) open(saved,true);

function init(){
  // countdowns
  const today=new Date(); today.setHours(0,0,0,0);
  document.querySelectorAll("[data-until]").forEach(el=>{
    const d=new Date(el.dataset.until+"T00:00:00"); const n=Math.round((d-today)/864e5);
    el.textContent=n>0?n:(n===0?"Today":"Done");
  });
  // tabs
  const tabs=[...document.querySelectorAll(".tabs button")];
  function show(id){
    tabs.forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===id));
    document.querySelectorAll("section[data-sec]").forEach(s=>s.hidden=s.dataset.sec!==id);
    set(LSTAB,id);
  }
  tabs.forEach(b=>b.addEventListener("click",()=>{show(b.dataset.tab);window.scrollTo({top:document.querySelector(".tabs").offsetTop,behavior:"auto"});}));
  show(get(LSTAB)&&document.querySelector('[data-sec="'+get(LSTAB)+'"]')?get(LSTAB):"now");
  // ticks
  let ticks={}; try{ticks=JSON.parse(get(LST)||"{}")}catch(e){}
  function progress(){
    document.querySelectorAll("[data-prog]").forEach(p=>{
      const box=document.getElementById(p.dataset.prog); if(!box) return;
      const all=box.querySelectorAll(".it input"), done=box.querySelectorAll(".it input:checked");
      p.querySelector("u").style.width=(all.length?100*done.length/all.length:0)+"%";
      p.querySelector("em").textContent=done.length+" of "+all.length+" done";
    });
  }
  document.querySelectorAll(".it").forEach(l=>{
    const c=l.querySelector("input"); c.checked=!!ticks[l.dataset.id];
    c.addEventListener("change",()=>{ if(c.checked) ticks[l.dataset.id]=1; else delete ticks[l.dataset.id]; set(LST,JSON.stringify(ticks)); progress(); });
  });
  progress();
  // copy buttons on ready-made messages
  document.querySelectorAll(".cp").forEach(b=>b.addEventListener("click",async()=>{
    const txt=b.closest(".msg").querySelector("pre").innerText.trim();
    try{await navigator.clipboard.writeText(txt);}
    catch(e){const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();}
    b.textContent="Copied";b.classList.add("done");setTimeout(()=>{b.textContent="Copy";b.classList.remove("done");},1600);
  }));
  // calendar: mark today and past
  const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const t=iso(today);
  document.querySelectorAll(".day[data-date]").forEach(d=>{ if(d.dataset.date===t) d.classList.add("today"); else if(d.dataset.date<t) d.classList.add("gone"); });
  document.querySelectorAll(".rail div[data-date]").forEach(d=>{ if(d.dataset.date<t) d.classList.add("past"); });
}
</script>
</body>
</html>
